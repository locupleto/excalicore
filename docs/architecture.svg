<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" role="img" aria-label="An application imports excalicore's modules; excalicore works on Excalidraw elements">
<style>
.bg { fill: #ffffff; }
